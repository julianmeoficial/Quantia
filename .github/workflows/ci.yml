name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
  NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:4000
  A11Y_PORT: "3000"

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  a11y:
    name: axe (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-reports
          path: |
            reports/axe
            playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx puppeteer browsers install chrome
      - name: Lighthouse CI
        run: npm run test:lighthouse
        env:
          CI: "true"
          # resolveChromePath in lighthouserc.cjs also probes ~/.cache/puppeteer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: reports/lighthouse
          retention-days: 14
